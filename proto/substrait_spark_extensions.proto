syntax = "proto3";

package io.github.zzjason.substrait.spark.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "io.github.zzjason.substrait.spark.v1";

// Required in Plan.advanced_extensions.enhancement for the strict profile.
message PlanSemantics {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  uint32 protocol_patch = 3;
  // The 32-byte canonical SHA-256 from protocol/contract.json.
  bytes canonical_sha256 = 4;
}

// Required in ReadRel.advanced_extension.enhancement for timestamp-bearing reads.
message SparkReadSemantics {
  // Schema version for this v1 message. The only supported value is 1.
  uint32 protocol_version = 1;
  // Canonical IANA ZoneId, including UTC.
  string session_timezone = 2;
  CalendarRebaseMode datetime_rebase_mode = 3;
  CalendarRebaseMode int96_rebase_mode = 4;
  Int96TimestampConversion int96_timestamp_conversion = 5;
  repeated TimestampField timestamp_fields = 6;
}

message TimestampField {
  // Ordinal path through ReadRel.base_schema, including nested containers.
  repeated PathSegment path = 1;
  SparkTimestampIdentity spark_identity = 2;
  PhysicalTimestampSemantics physical_semantics = 3;
  ParquetTimestampEncoding physical_encoding = 4;
  uint32 source_fractional_second_precision = 5;
}

message PathSegment {
  oneof kind {
    uint32 struct_field = 1;
    google.protobuf.Empty list_element = 2;
    google.protobuf.Empty map_key = 3;
    google.protobuf.Empty map_value = 4;
  }
}

enum SparkTimestampIdentity {
  SPARK_TIMESTAMP_IDENTITY_UNSPECIFIED = 0;
  SPARK_TIMESTAMP_LTZ = 1;
  SPARK_TIMESTAMP_NTZ = 2;
}

enum PhysicalTimestampSemantics {
  PHYSICAL_TIMESTAMP_SEMANTICS_UNSPECIFIED = 0;
  UTC_INSTANT = 1;
  LOCAL_DATETIME = 2;
}

enum ParquetTimestampEncoding {
  PARQUET_TIMESTAMP_ENCODING_UNSPECIFIED = 0;
  INT64_MILLIS = 1;
  INT64_MICROS = 2;
  INT64_NANOS = 3;
  INT96 = 4;
}

enum CalendarRebaseMode {
  CALENDAR_REBASE_MODE_UNSPECIFIED = 0;
  CORRECTED = 1;
  LEGACY = 2;
  EXCEPTION = 3;
}

enum Int96TimestampConversion {
  INT96_TIMESTAMP_CONVERSION_UNSPECIFIED = 0;
  INT96_TIMESTAMP_CONVERSION_DISABLED = 1;
  INT96_TIMESTAMP_CONVERSION_ENABLED = 2;
}
